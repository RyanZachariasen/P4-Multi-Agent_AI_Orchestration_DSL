name: CI

on:
  pull_request:
    branches:
      - main

permissions: read-all

defaults:
  run:
    working-directory: ./multi-agent_orchestration

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest] 
      fail-fast: false

    steps:
      - name: Checkout tree
        uses: actions/checkout@v4

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5
          dune-cache: true

      - name: Install dependencies
        run: opam install . --deps-only --with-test

      - name: Build
        run: opam exec -- dune build

      - name: Run tests
        run: opam exec -- dune runtest

  dsl-tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout tree
        uses: actions/checkout@v4

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5
          dune-cache: true

      - name: Install dependencies
        run: opam install . --deps-only --with-test

      - name: Build binary
        run: opam exec -- dune build

      - name: Run DSL syntax + typing tests
        run: |
          chmod +x test/run_tests.sh
          bash test/run_tests.sh _build/default/bin/multi-agent_orchestration

  lint-opam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5
      - name: Lint Opam
        run: opam exec -- opam lint *.opam